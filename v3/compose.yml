name: exposurescopex-v3

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-exposurescopex}
      POSTGRES_USER: ${POSTGRES_USER:-exposurescopex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-before-production}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    networks: [internal]

  api:
    build:
      context: ./backend
      target: api
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://exposurescopex:change-me-before-production@postgres:5432/exposurescopex}
      ARTIFACT_ROOT: ${ARTIFACT_ROOT:-/data/artifacts}
      DEPLOYMENT_MODE: ${DEPLOYMENT_MODE:-development}
      SECURE_COOKIES: ${SECURE_COOKIES:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3001,http://127.0.0.1:3001}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:-MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
      SCOPE_VALIDATION_KEY: ${SCOPE_VALIDATION_KEY:-change-this-scope-validation-key-before-production}
      AI_EVALUATOR_PROVIDER: ${AI_EVALUATOR_PROVIDER:-disabled}
      AI_EVALUATOR_MODEL: ${AI_EVALUATOR_MODEL:-}
      AI_EVALUATOR_BASE_URL: ${AI_EVALUATOR_BASE_URL:-https://api.openai.com/v1}
      AI_EVALUATOR_API_KEY: ${AI_EVALUATOR_API_KEY:-}
      AI_EVALUATOR_TIMEOUT_SECONDS: ${AI_EVALUATOR_TIMEOUT_SECONDS:-90}
      AI_EVALUATOR_ALLOW_INTERNAL_DATA: ${AI_EVALUATOR_ALLOW_INTERNAL_DATA:-false}
      AI_EVALUATOR_REQUIRE_INDEPENDENT_APPROVAL: ${AI_EVALUATOR_REQUIRE_INDEPENDENT_APPROVAL:-false}
      AI_EVALUATOR_ADAPTER_TIMEOUT_SECONDS: ${AI_EVALUATOR_ADAPTER_TIMEOUT_SECONDS:-20}
      AI_EVALUATOR_ADAPTER_MAX_CASES: ${AI_EVALUATOR_ADAPTER_MAX_CASES:-100}
      AI_EVALUATOR_ADAPTER_MAX_CASE_BYTES: ${AI_EVALUATOR_ADAPTER_MAX_CASE_BYTES:-16384}
      AI_EVALUATOR_ADAPTER_MAX_REQUEST_BYTES: ${AI_EVALUATOR_ADAPTER_MAX_REQUEST_BYTES:-524288}
      AI_EVALUATOR_ADAPTER_MAX_RESPONSE_BYTES: ${AI_EVALUATOR_ADAPTER_MAX_RESPONSE_BYTES:-524288}
      AI_EVALUATOR_ADAPTER_ALLOWED_HOSTS: ${AI_EVALUATOR_ADAPTER_ALLOWED_HOSTS:-}
      AI_EVALUATOR_ADAPTER_PRIVATE_NETWORKS: ${AI_EVALUATOR_ADAPTER_PRIVATE_NETWORKS:-}
      AI_EVALUATOR_CLIENT_MAX_PACKAGE_AGE_HOURS: ${AI_EVALUATOR_CLIENT_MAX_PACKAGE_AGE_HOURS:-24}
      AI_EVALUATOR_GITHUB_OIDC_AUDIENCE: ${AI_EVALUATOR_GITHUB_OIDC_AUDIENCE:-exposurescopex-evaluator}
      AI_EVALUATOR_GITHUB_OIDC_JWKS_URL: ${AI_EVALUATOR_GITHUB_OIDC_JWKS_URL:-https://token.actions.githubusercontent.com/.well-known/jwks}
    ports:
      - "127.0.0.1:8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 10
    volumes:
      # The API regenerates terminal-scan reports on demand and must persist
      # the resulting DOCX, PDF, and evidence bundle.
      - artifacts:/data/artifacts
      - ./benchmarks:/app/benchmarks:ro
    networks: [internal, edge]

  runner:
    build:
      context: ./backend
      target: runner
    command: ["python", "-m", "app.runner"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://exposurescopex:change-me-before-production@postgres:5432/exposurescopex}
      ARTIFACT_ROOT: ${ARTIFACT_ROOT:-/data/artifacts}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:-MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
      NUCLEI_TEMPLATES_DIR: /opt/nuclei-templates
      RUNNER_POLL_SECONDS: "2"
    depends_on:
      postgres:
        condition: service_healthy
    stop_grace_period: 45s
    restart: unless-stopped
    volumes:
      - artifacts:/data/artifacts
      # Reports are finalized by the runner, so it needs the same immutable
      # benchmark manifest available to the API's on-demand report endpoint.
      - ./benchmarks:/app/benchmarks:ro
    networks: [internal, egress]

  web:
    build:
      context: ./web
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8001}
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      api:
        condition: service_healthy
    networks: [edge]

volumes:
  postgres_data:
  artifacts:

networks:
  edge:
  internal:
    internal: true
  egress:
