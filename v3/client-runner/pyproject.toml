[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "exposurescopex-eval-runner"
version = "0.15.4"
description = "Run local-first ExposureScopeX AI pre-release evaluations in a customer environment."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["cryptography>=42,<47"]

[project.optional-dependencies]
browser = ["playwright>=1.49,<2"]

[project.scripts]
esx-eval = "esx_eval_runner.cli:main"

[tool.setuptools.packages.find]
include = ["esx_eval_runner*"]
