name: exposurescopex

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging: *default-logging

  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-development-only-change-me}
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-development-only-change-me}"]
    networks: [internal]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping 2>/dev/null | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging: *default-logging

  backend:
    image: exposurescopex-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD:-development-only-change-me}@redis:6379/0
      REDIS_PASSWORD: ${REDIS_PASSWORD:-development-only-change-me}
      MCP_LOCALHOST_ALIAS: host.docker.internal
      METRICS_BEARER_TOKEN: ${METRICS_BEARER_TOKEN:-development-metrics-token-change-me-123456}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8001}:8000"
    networks: [edge, internal, egress]
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    pids_limit: 256
    mem_limit: 1g
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../results:/app/results:ro
      - ./seed:/app/seed:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready')\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    restart: unless-stopped
    logging: *default-logging

  worker:
    build:
      context: ..
      dockerfile: webapp/worker/Dockerfile
    env_file:
      - .env
    user: "${HOST_UID:-501}:${HOST_GID:-20}"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DATABASE_NULL_POOL: "true"
      REDIS_URL: redis://:${REDIS_PASSWORD:-development-only-change-me}@redis:6379/0
      REDIS_PASSWORD: ${REDIS_PASSWORD:-development-only-change-me}
      NUCLEI_TEMPLATE_AUTOUPDATE: ${NUCLEI_TEMPLATE_AUTOUPDATE:-true}
      NUCLEI_TEMPLATE_REFRESH_HOURS: ${NUCLEI_TEMPLATE_REFRESH_HOURS:-24}
      NUCLEI_STAGE_TIMEOUT_LIGHT: ${NUCLEI_STAGE_TIMEOUT_LIGHT:-1860}
      NUCLEI_STAGE_TIMEOUT_MEDIUM: ${NUCLEI_STAGE_TIMEOUT_MEDIUM:-3660}
      NUCLEI_STAGE_TIMEOUT_AGGRESSIVE: ${NUCLEI_STAGE_TIMEOUT_AGGRESSIVE:-7260}
      NUCLEI_TOOL_TIMEOUT_LIGHT: ${NUCLEI_TOOL_TIMEOUT_LIGHT:-1800}
      NUCLEI_TOOL_TIMEOUT_MEDIUM: ${NUCLEI_TOOL_TIMEOUT_MEDIUM:-3600}
      NUCLEI_TOOL_TIMEOUT_AGGRESSIVE: ${NUCLEI_TOOL_TIMEOUT_AGGRESSIVE:-7200}
      EXPOSURESCOPEX_RETAIN_REPOSITORY_CHECKOUT: ${EXPOSURESCOPEX_RETAIN_REPOSITORY_CHECKOUT:-false}
      WORKER_QUEUES: ${WORKER_QUEUES:-scans-web,scans-api,scans-artifact,scans-cloud,scans-mobile,scans}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
      SCAN_STALL_WARNING_SECONDS: ${SCAN_STALL_WARNING_SECONDS:-600}
      MAX_ENUMERATION_TARGETS: ${MAX_ENUMERATION_TARGETS:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    volumes:
      - ../results:/app/results
      - nuclei_runtime:/app/runtime
      - ./backend/app:/app/app:ro
      - ../exposurescopex.sh:/app/exposurescopex.sh:ro
      - ../modules:/app/modules:ro
      - ../config:/app/config:ro
    networks: [internal, egress]
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [NET_RAW]
    pids_limit: 1024
    mem_limit: 6g
    command: >
      celery -A app.services.celery_app:celery_app worker
      --loglevel=info
      --queues=${WORKER_QUEUES:-scans-web,scans-api,scans-artifact,scans-cloud,scans-mobile,scans}
      --concurrency=${WORKER_CONCURRENCY:-2}
      --max-tasks-per-child=10
      --max-memory-per-child=2097152
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.services.celery_app:celery_app inspect ping --destination=celery@$$HOSTNAME --timeout=5 | grep -q pong"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    stop_grace_period: 45s
    logging: *default-logging

  # Keep reports and control-plane jobs responsive while scan slots are busy.
  worker-support:
    extends: { service: worker }
    environment:
      WORKER_QUEUES: reports,default
      WORKER_CONCURRENCY: ${SUPPORT_WORKER_CONCURRENCY:-1}
    command: >
      celery -A app.services.celery_app:celery_app worker --loglevel=info
      --queues=reports,default --concurrency=${SUPPORT_WORKER_CONCURRENCY:-1}
      --max-tasks-per-child=20 --max-memory-per-child=2097152

  worker-web:
    extends: { service: worker }
    profiles: [worker-pools]
    environment:
      WORKER_QUEUES: scans-web
      WORKER_CONCURRENCY: ${WEB_WORKER_CONCURRENCY:-2}
    command: >
      celery -A app.services.celery_app:celery_app worker --loglevel=info
      --queues=scans-web --concurrency=${WEB_WORKER_CONCURRENCY:-2}
      --max-tasks-per-child=10 --max-memory-per-child=2097152

  worker-api:
    extends: { service: worker }
    profiles: [worker-pools]
    environment:
      WORKER_QUEUES: scans-api
      WORKER_CONCURRENCY: ${API_WORKER_CONCURRENCY:-2}
    command: >
      celery -A app.services.celery_app:celery_app worker --loglevel=info
      --queues=scans-api --concurrency=${API_WORKER_CONCURRENCY:-2}
      --max-tasks-per-child=20 --max-memory-per-child=2097152

  worker-artifact:
    extends: { service: worker }
    profiles: [worker-pools]
    environment:
      WORKER_QUEUES: scans-artifact
      WORKER_CONCURRENCY: ${ARTIFACT_WORKER_CONCURRENCY:-1}
    command: >
      celery -A app.services.celery_app:celery_app worker --loglevel=info
      --queues=scans-artifact --concurrency=${ARTIFACT_WORKER_CONCURRENCY:-1}
      --max-tasks-per-child=5 --max-memory-per-child=4194304

  worker-cloud:
    extends: { service: worker }
    profiles: [worker-pools]
    environment:
      WORKER_QUEUES: scans-cloud
      WORKER_CONCURRENCY: ${CLOUD_WORKER_CONCURRENCY:-1}
    command: >
      celery -A app.services.celery_app:celery_app worker --loglevel=info
      --queues=scans-cloud --concurrency=${CLOUD_WORKER_CONCURRENCY:-1}
      --max-tasks-per-child=5 --max-memory-per-child=4194304

  worker-mobile:
    extends: { service: worker }
    profiles: [worker-pools]
    environment:
      WORKER_QUEUES: scans-mobile
      WORKER_CONCURRENCY: ${MOBILE_WORKER_CONCURRENCY:-1}
    command: >
      celery -A app.services.celery_app:celery_app worker --loglevel=info
      --queues=scans-mobile --concurrency=${MOBILE_WORKER_CONCURRENCY:-1}
      --max-tasks-per-child=5 --max-memory-per-child=4194304

  worker-core:
    extends: { service: worker }
    profiles: [worker-pools]
    environment:
      WORKER_QUEUES: scans,default
      WORKER_CONCURRENCY: ${CORE_WORKER_CONCURRENCY:-1}
    command: >
      celery -A app.services.celery_app:celery_app worker --loglevel=info
      --queues=scans,default --concurrency=${CORE_WORKER_CONCURRENCY:-1}
      --max-tasks-per-child=20 --max-memory-per-child=2097152

  worker-report:
    extends: { service: worker }
    profiles: [worker-pools]
    environment:
      WORKER_QUEUES: reports
      WORKER_CONCURRENCY: ${REPORT_WORKER_CONCURRENCY:-1}
    command: >
      celery -A app.services.celery_app:celery_app worker --loglevel=info
      --queues=reports --concurrency=${REPORT_WORKER_CONCURRENCY:-1}
      --max-tasks-per-child=5 --max-memory-per-child=2097152

  scheduler:
    image: exposurescopex-backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD:-development-only-change-me}@redis:6379/0
      REDIS_PASSWORD: ${REDIS_PASSWORD:-development-only-change-me}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    command: >
      celery -A app.services.celery_app:celery_app beat
      --loglevel=info
      --schedule=/tmp/celerybeat-schedule
    networks: [internal, egress]
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    pids_limit: 256
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1 && test -f /tmp/celerybeat-schedule"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    logging: *default-logging

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8001}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8001}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-changeme_generate_with_openssl_rand_hex_32}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3001}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3001}:3000"
    networks: [edge]
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    pids_limit: 256
    mem_limit: 1g
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/login || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    logging: *default-logging

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${NGINX_BIND_ADDRESS:-127.0.0.1}:${NGINX_HTTP_PORT:-8081}:80"
      - "${NGINX_BIND_ADDRESS:-127.0.0.1}:${NGINX_HTTPS_PORT:-8444}:443"
    networks: [edge]
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID, NET_BIND_SERVICE]
    pids_limit: 256
    mem_limit: 512m
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    logging: *default-logging

  prometheus:
    image: prom/prometheus:v3.14.0
    profiles: [monitoring]
    environment:
      METRICS_BEARER_TOKEN: ${METRICS_BEARER_TOKEN:-development-metrics-token-change-me-123456}
    command: ["sh", "/etc/prometheus/prometheus-entrypoint.sh"]
    volumes:
      - ./monitoring/prometheus.yml.template:/etc/prometheus/prometheus.yml.template:ro
      - ./monitoring/prometheus-entrypoint.sh:/etc/prometheus/prometheus-entrypoint.sh:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    networks: [internal]
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    pids_limit: 128
    mem_limit: 768m
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging

  grafana:
    image: grafana/grafana:13.2.1
    profiles: [monitoring]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-development-grafana-password}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_COOKIE_SECURE: ${GRAFANA_COOKIE_SECURE:-false}
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3002}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks: [internal, edge]
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    pids_limit: 256
    mem_limit: 768m
    depends_on: [prometheus]
    restart: unless-stopped
    logging: *default-logging

volumes:
  postgres_data:
  redis_data:
  nginx_logs:
  nuclei_runtime:
  prometheus_data:
  grafana_data:

networks:
  edge:
  internal:
    internal: true
  egress:
