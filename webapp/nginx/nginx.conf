# ──────────────────────────────────────────────────────────────────────────────
# ExposureScopeX — nginx reverse proxy
#
# Dev:  HTTP on 80, plain proxy (TLS termination at nginx layer when certs exist)
# Prod: Replace self-signed certs with Let's Encrypt / ACM / GCP-managed certs
#       Set DOMAIN env var and uncomment the HTTPS server block
# ──────────────────────────────────────────────────────────────────────────────

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ── Logging ───────────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time urt=$upstream_response_time';
    access_log /var/log/nginx/access.log main;

    # ── Performance ───────────────────────────────────────────────────────────
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain application/json application/javascript text/css
               text/xml application/xml application/xml+rss;
    gzip_min_length 1024;

    # ── Security ──────────────────────────────────────────────────────────────
    server_tokens off;                        # hide nginx version
    client_max_body_size 20m;                 # max upload (CSV imports)
    client_body_timeout 30s;
    client_header_timeout 30s;
    send_timeout 60s;

    # ── Rate limiting zones ───────────────────────────────────────────────────
    # Burst allows short spikes; requests above burst are queued (nodelay drops)
    limit_req_zone $binary_remote_addr zone=api:10m       rate=60r/m;
    limit_req_zone $binary_remote_addr zone=auth:10m      rate=10r/m;
    limit_req_zone $binary_remote_addr zone=upload:10m    rate=5r/m;
    limit_req_status 429;

    # ── Upstream services ─────────────────────────────────────────────────────
    upstream backend {
        zone backend_upstream 64k;
        server backend:8000 resolve;
        keepalive 32;
    }

    upstream frontend {
        zone frontend_upstream 64k;
        server frontend:3000 resolve;
        keepalive 16;
    }

    # ── HTTP server (dev + Let's Encrypt ACME challenge) ─────────────────────
    server {
        listen 80;
        server_name _;

        # ACME challenge (Let's Encrypt)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # In production: redirect all HTTP → HTTPS
        # Uncomment when certs are in place:
        # return 301 https://$host$request_uri;

        # ── Security headers ─────────────────────────────────────────────────
        add_header X-Content-Type-Options  "nosniff"           always;
        add_header X-Frame-Options         "DENY"              always;
        add_header X-XSS-Protection        "1; mode=block"     always;
        add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy      "geolocation=(), microphone=(), camera=()" always;

        # ── API routes → FastAPI backend ─────────────────────────────────────
        location /api/ {
            limit_req zone=api burst=20 nodelay;

            proxy_pass http://backend;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_read_timeout 300s;    # long for scan endpoints
        }

        # ── Auth endpoints — tighter rate limit ──────────────────────────────
        location /api/v1/auth/ {
            limit_req zone=auth burst=5 nodelay;

            proxy_pass http://backend;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── CSV upload endpoint — very tight ─────────────────────────────────
        location /api/v1/asm/targets/import {
            limit_req zone=upload burst=2 nodelay;
            client_max_body_size 5m;

            proxy_pass http://backend;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── WebSocket — scan progress ─────────────────────────────────────────
        location /ws/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host       $host;
            proxy_set_header X-Real-IP  $remote_addr;
            proxy_read_timeout 3600s;   # WS connections can be long-lived
        }

        # ── API docs ─────────────────────────────────────────────────────────
        location ~ ^/(docs|redoc|openapi.json) {
            proxy_pass http://backend;
            proxy_set_header Host $host;
        }

        # ── Health check ──────────────────────────────────────────────────────
        location /health {
            proxy_pass http://backend;
            access_log off;
        }

        # ── Frontend — everything else ────────────────────────────────────────
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";  # Next.js HMR WebSocket
        }
    }

    # ── HTTPS server (production — uncomment and set ssl_certificate paths) ──
    # server {
    #     listen 443 ssl http2;
    #     server_name your-domain.com;
    #
    #     ssl_certificate     /etc/nginx/certs/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/certs/privkey.pem;
    #
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:
    #                 ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:
    #                 ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    #     ssl_prefer_server_ciphers off;
    #     ssl_session_cache shared:SSL:10m;
    #     ssl_session_timeout 1d;
    #     ssl_stapling on;
    #     ssl_stapling_verify on;
    #
    #     add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    #     add_header X-Content-Type-Options  "nosniff"           always;
    #     add_header X-Frame-Options         "DENY"              always;
    #     add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;" always;
    #
    #     # Same proxy blocks as HTTP server above...
    # }
}
