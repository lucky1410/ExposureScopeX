apiVersion: v1
kind: Namespace
metadata:
  name: exposurescopex
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: exposurescopex-worker
  namespace: exposurescopex
automountServiceAccountToken: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: exposurescopex-scanner
  namespace: exposurescopex
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: exposurescopex-scan-job-controller
  namespace: exposurescopex
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: exposurescopex-worker-controls-scan-jobs
  namespace: exposurescopex
subjects:
  - kind: ServiceAccount
    name: exposurescopex-worker
    namespace: exposurescopex
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: exposurescopex-scan-job-controller
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: exposurescopex-scanner-ingress-deny
  namespace: exposurescopex
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: exposurescopex-scanner
  policyTypes: [Ingress]
  ingress: []
