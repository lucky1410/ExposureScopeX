name: Release ESX Eval Runner

on:
  push:
    tags:
      - "esx-eval-runner-v*"

permissions:
  contents: write
  attestations: write
  id-token: write

jobs:
  release:
    name: Build and publish verified client runner
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the wheel
        working-directory: v3/client-runner
        run: |
          python -m pip install --upgrade pip build
          expected_version="${GITHUB_REF_NAME#esx-eval-runner-v}"
          package_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "$expected_version" = "$package_version"
          python -m pip install .
          python -m unittest discover -s tests -v
          python -m compileall -q esx_eval_runner
          python -m build --wheel --outdir dist
          sha256sum dist/*.whl > dist/SHA256SUMS

      - name: Attest build provenance
        if: ${{ vars.ESX_ENABLE_GITHUB_ATTESTATIONS == 'true' }}
        uses: actions/attest@v4
        with:
          subject-path: v3/client-runner/dist/*.whl

      - name: Create immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            v3/client-runner/dist/*.whl \
            v3/client-runner/dist/SHA256SUMS \
            --title "ESX Eval Runner ${GITHUB_REF_NAME#esx-eval-runner-v}" \
            --generate-notes \
            --verify-tag
