name: Release ESX Eval Runner

on:
  push:
    tags:
      - "esx-eval-runner-v*"

permissions:
  contents: write
  attestations: write
  id-token: write

jobs:
  release:
    name: Build and publish verified client runner
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the wheel
        working-directory: v3/client-runner
        run: |
          python -m pip install --upgrade pip build
          expected_version="${GITHUB_REF_NAME#esx-eval-runner-v}"
          package_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "$expected_version" = "$package_version"
          python -m pip install .
          python -m unittest discover -s tests -v
          python tests/run_system_acceptance.py --out acceptance-evidence --real-schedule
          python tests/run_whole_system_acceptance.py --out whole-system-evidence
          python -m compileall -q esx_eval_runner
          python -m build --wheel --outdir dist
          cp README.md APPLICATION_SETUP.md RELEASE_REVIEW.md RELEASE_NOTES.md PRE-D_EVIDENCE_GUIDE.md DECISION_EVALUATION.md CONFIDENCE_PROVENANCE.md WHOLE_SYSTEM_TESTING.md BROWSER_WORKFLOWS.md ADAPTER_V2.md CONNECTORS.md SECURITY.md SYSTEM_EVALUATION.md SYSTEM_ACCEPTANCE.md dist/
          cd dist
          sha256sum *.whl *.md > SHA256SUMS

      - name: Retain six-stage acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-runner-acceptance
          path: |
            v3/client-runner/acceptance-evidence/
            v3/client-runner/whole-system-evidence/
          if-no-files-found: ignore

      - name: Attest build provenance
        if: ${{ vars.ESX_ENABLE_GITHUB_ATTESTATIONS == 'true' }}
        uses: actions/attest@v4
        with:
          subject-path: v3/client-runner/dist/*.whl

      - name: Create immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            v3/client-runner/dist/*.whl \
            v3/client-runner/dist/*.md \
            v3/client-runner/dist/SHA256SUMS \
            --title "ESX Eval Runner ${GITHUB_REF_NAME#esx-eval-runner-v}" \
            --notes-file v3/client-runner/RELEASE_NOTES.md \
            --verify-tag
